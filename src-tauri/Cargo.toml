[package]
name = "jumpchain-visualizer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Offline-first desktop editor and tracker for Jumpchain packages and chains."

[lib]
name = "jumpchain_visualizer_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
archive-core = { path = "../crates/archive-core" }
persistence = { path = "../crates/persistence" }
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.6.0"
tauri-plugin-wdio-webdriver = "1.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["screenshot", "tokio"] }

[lints]
workspace = true
